name: Clean v0.9.0 release downloads

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-asset-cleanup.yml]

permissions:
  contents: read

concurrency:
  group: release-v0.9.0-asset-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[clean-release-assets]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out maintenance tools
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Back up and verify current downloads
        run: |
          python3 tests/tools/ReleasePublicationTests.py
          python3 tests/tools/ReleaseCleanupTests.py

      - name: Download verified backup
        run: python3 tools/clean_release_assets.py --repository "$GH_REPO" --tag v0.9.0 --backup build/release-backup

      - name: Retain original reports and checksum manifests
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sawer-v0.9.0-release-assets-backup
          path: build/release-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Keep packages and update checksum lists
        run: python3 tools/clean_release_assets.py --repository "$GH_REPO" --tag v0.9.0 --backup build/release-backup --apply
