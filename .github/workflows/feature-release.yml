name: Feature v0.9.0 in repository sidebar

on:
  push:
    branches: [main]
    paths: [.github/workflows/feature-release.yml]

permissions:
  contents: read

jobs:
  feature:
    if: contains(github.event.head_commit.message, '[feature-release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark the existing release as Latest
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          endpoint = f"repos/{os.environ['GH_REPO']}/releases"

          def api(*arguments):
              result = subprocess.run(["gh", "api", *arguments], check=True,
                                      capture_output=True, text=True, timeout=60)
              return json.loads(result.stdout)

          before = api(f"{endpoint}/tags/v0.9.0")
          if before["id"] != 403163913 or before["draft"] or before["tag_name"] != "v0.9.0":
              raise RuntimeError("Unexpected release; refusing to change it")
          packages = {(asset["id"], asset["name"], asset["digest"]) for asset in before["assets"]}
          api("--method", "PATCH", f"{endpoint}/{before['id']}",
              "-F", "prerelease=false", "-f", "make_latest=true")
          latest = api(f"{endpoint}/latest")
          if latest["id"] != before["id"] or latest["prerelease"] or latest["draft"]:
              raise RuntimeError("The release was not marked Latest")
          if packages != {(asset["id"], asset["name"], asset["digest"]) for asset in latest["assets"]}:
              raise RuntimeError("Release assets changed unexpectedly")
          print("Sawer v0.9.0 is Latest; all download assets are preserved")
          PY
