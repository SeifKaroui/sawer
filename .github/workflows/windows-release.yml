name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Windows AMD64
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      NSIS_CACHE_DIR: ${{ github.workspace }}/.cache/nsis-3.12
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Show checked-out revision
        shell: pwsh
        run: |
          git log -1 --format='%H %s'
          "Source commit: $env:GITHUB_SHA (attempt $env:GITHUB_RUN_ATTEMPT)" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore dependency downloads
        id: dependency-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            subprojects/packagecache
            .cache/fonts
            .cache/pip
          key: ${{ runner.os }}-sawer-downloads-v1-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**', 'meson.build', 'tools/fetch_file.py', 'tools/ci-requirements.txt') }}

      - name: Set up deterministic icon tooling
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14"

      - name: Validate Windows icon
        shell: pwsh
        run: |
          python -m pip install `
            --disable-pip-version-check `
            --only-binary=:all: `
            -r tools/ci-requirements.txt
          python tools/generate_windows_icon.py `
            assets/logo.png assets/windows/Sawer.ico --check

      - name: Set up MinGW build environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Restore NSIS installation
        id: nsis-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/nsis-3.12
          key: ${{ runner.os }}-nsis-3.12-56581f90db321581-v1

      - name: Set up pinned NSIS compiler
        id: nsis
        shell: pwsh
        run: |
          $directory = $env:NSIS_CACHE_DIR
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $archive = Join-Path $directory 'nsis-3.12.zip'
          $expected = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $downloaded = (Test-Path -LiteralPath $archive) -and
            (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -eq $expected
          foreach ($mirror in @('netix', 'phoenixnap')) {
            if ($downloaded) { break }
            $url = "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip?use_mirror=$mirror"
            curl.exe --fail --silent --show-error --location `
              --proto '=https' --proto-redir '=https' `
              --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 2 `
              --output $archive $url
            if ($LASTEXITCODE -eq 0 -and
                (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -eq $expected) {
              $downloaded = $true
              break
            }
            Write-Warning "NSIS download failed or checksum mismatch on $mirror; trying the next mirror"
          }
          if (-not $downloaded) {
            throw 'Could not download the checksum-verified NSIS archive over HTTPS'
          }
          $compilerDirectory = Join-Path $directory 'nsis-3.12'
          if (-not (Test-Path -LiteralPath (Join-Path $compilerDirectory 'makensis.exe'))) {
            Expand-Archive -LiteralPath $archive -DestinationPath $directory -Force
          }
          if ((& (Join-Path $compilerDirectory 'makensis.exe') -VERSION) -ne 'v3.12') {
            throw 'Unexpected NSIS compiler version'
          }
          "compiler=$(Join-Path $compilerDirectory 'makensis.exe')" >> $env:GITHUB_OUTPUT

      - name: Save verified NSIS installation
        if: steps.nsis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/nsis-3.12
          key: ${{ steps.nsis-cache.outputs.cache-primary-key }}

      - name: Validate source version
        id: release
        shell: msys2 {0}
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          arguments=(--source-root . --print-version)
          if [[ -n "$RELEASE_TAG" ]]; then
            arguments+=(--tag "$RELEASE_TAG")
          fi
          version="$(python tools/check_release.py "${arguments[@]}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configure Release build
        shell: msys2 {0}
        run: >-
          meson setup build --buildtype=release -Dsawer_werror=true
          -Dfont_cache_dir="$PWD/.cache/fonts"

      - name: Build Sawer and tests
        shell: msys2 {0}
        run: meson compile -C build

      - name: Retain verified fonts
        shell: msys2 {0}
        run: |
          mkdir -p .cache/fonts
          cp build/Inter-{Regular,Medium,SemiBold}.ttf .cache/fonts/

      - name: Save dependency downloads
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            subprojects/packagecache
            .cache/fonts
            .cache/pip
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}

      - name: Run release-safe tests
        shell: msys2 {0}
        run: >-
          meson test -C build --print-errorlogs
          unit
          "font fetch recovery"
          "Unicode file commands"
          "portable documentation layout"
          "installer preservation helpers"
          "version command"
          "third-party notices command"

      - name: Prepare portable asset
        shell: msys2 {0}
        run: |
          mkdir -p dist
          asset="Sawer-Portable.exe"
          cp build/Sawer.exe "dist/$asset"
          cp THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          python tools/check_release.py \
            --source-root . \
            --executable "dist/$asset"
          if objdump -p "dist/$asset" \
              | grep -Eiq 'DLL Name: (libgcc|libstdc\+\+|libwinpthread|SDL3)'; then
            echo "Sawer has an unexpected redistributable DLL dependency" >&2
            exit 1
          fi

      - name: Verify portable metadata
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          Add-Type -AssemblyName System.Drawing
          $asset = "dist/Sawer-Portable.exe"
          $metadata = (Get-Item -LiteralPath $asset).VersionInfo
          if ($metadata.ProductVersion -ne $env:VERSION) {
            throw "ProductVersion '$($metadata.ProductVersion)' does not match '$env:VERSION'"
          }
          if ($metadata.FileDescription -ne "Sawer Whiteboard") {
            throw "Sawer.exe is missing its Windows resource metadata"
          }
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path $asset))
          if ($null -eq $icon) {
            throw "Sawer.exe is missing its embedded application icon"
          }
          $icon.Dispose()

      - name: Build one-click installer
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NSIS_COMPILER: ${{ steps.nsis.outputs.compiler }}
        run: |
          compiler="$(cygpath -u "$NSIS_COMPILER")"
          if [[ "$("$compiler" -VERSION)" != "v3.12" ]]; then
            echo "Unexpected NSIS compiler version" >&2
            exit 1
          fi
          portable="$(cygpath -w "$(pwd)/dist/Sawer-Portable.exe")"
          output="$(cygpath -w "$(pwd)/dist")"
          script="$(cygpath -w "$(pwd)/packaging/windows/Sawer.nsi")"
          MSYS2_ARG_CONV_EXCL='*' "$compiler" \
            /WX \
            "/DAPP_VERSION=$VERSION" \
            "/DAPP_EXE=$portable" \
            "/DOUTPUT_DIR=$output" \
            "$script"

      - name: Retrieve a previous installer for upgrade checks
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $releases = & gh api "repos/$env:GH_REPO/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Could not query previous releases" }
          $eligible = @($releases | Where-Object {
            -not $_.draft -and $_.tag_name -match '^v[0-9]+\.[0-9]+\.[0-9]+$' -and
            [version]($_.tag_name.Substring(1)) -lt [version]$env:VERSION -and
            @($_.assets.name) -contains 'Sawer-Setup.exe' -and
            @($_.assets.name) -contains 'SHA256SUMS.txt'
          } | Sort-Object { [version]($_.tag_name.Substring(1)) } -Descending)
          if ($eligible.Count -eq 0) {
            Write-Output 'SKIP older-version upgrade: no previous installer release exists'
            exit 0
          }
          $previous = $eligible[0]
          New-Item -ItemType Directory -Path out/installer-upgrade -Force | Out-Null
          & gh release download $previous.tag_name --repo $env:GH_REPO `
            --pattern Sawer-Setup.exe --pattern SHA256SUMS.txt --dir out/installer-upgrade
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous installer' }
          $entry = @(Get-Content out/installer-upgrade/SHA256SUMS.txt | Where-Object {
            $_ -match '^[0-9a-fA-F]{64}  Sawer-Setup\.exe$'
          })
          if ($entry.Count -ne 1) { throw 'Previous installer checksum is missing or ambiguous' }
          $expected = $entry[0].Substring(0, 64)
          $actual = (Get-FileHash out/installer-upgrade/Sawer-Setup.exe -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Previous installer checksum mismatch' }
          "installer=$((Resolve-Path out/installer-upgrade/Sawer-Setup.exe).Path)" >> $env:GITHUB_OUTPUT
          "version=$($previous.tag_name.Substring(1))" >> $env:GITHUB_OUTPUT

      - name: Test install, upgrade, and uninstall
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_INSTALLER: ${{ steps.previous.outputs.installer }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          $arguments = @{
            Installer = 'dist/Sawer-Setup.exe'
            PortableExecutable = 'dist/Sawer-Portable.exe'
            Version = $env:VERSION
            SourceRoot = '.'
            BoardValidator = 'build/sawer-format.exe'
          }
          if ($env:PREVIOUS_INSTALLER) {
            $arguments.PreviousInstaller = $env:PREVIOUS_INSTALLER
            $arguments.PreviousVersion = $env:PREVIOUS_VERSION
          }
          $arguments.DetectApplicationLaunchSupport = $true
          ./tools/test_windows_installer.ps1 @arguments

      - name: Create release checksums
        shell: pwsh
        run: |
          $names = @("Sawer-Setup.exe", "Sawer-Portable.exe")
          $lines = foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash
            "$($hash.ToLowerInvariant())  $name"
          }
          $encoding = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines(
            (Join-Path (Resolve-Path "dist") "SHA256SUMS.txt"),
            $lines,
            $encoding
          )

      - name: Upload tested Windows assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sawer-${{ steps.release.outputs.version }}-Windows-AMD64
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attest Windows executables
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: dist/Sawer-*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: msys2 {0}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          release_flags=()
          if [[ "$VERSION" == 0.* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/Sawer-Setup.exe" \
            "dist/Sawer-Portable.exe" \
            "dist/SHA256SUMS.txt" \
            "dist/THIRD_PARTY_NOTICES.md" \
            --verify-tag \
            --generate-notes \
            --title "Sawer ${VERSION}" \
            "${release_flags[@]}"
