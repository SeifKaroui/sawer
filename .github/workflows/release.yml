name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows-release.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  linux:
    uses: ./.github/workflows/linux-release.yml

  publish:
    name: Verify and publish both platforms
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 tools/check_release.py --source-root . --tag "$RELEASE_TAG"

      - name: Download tested Windows assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: sawer-${{ github.ref_name }}-windows-x64
          path: build/release/windows

      - name: Download tested Linux assets
        uses: actions/download-artifact@v8.0.1
        with:
          name: sawer-${{ github.ref_name }}-linux-x64
          path: build/release/linux

      - name: Verify downloads and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python3 tools/publish_release.py --repository "$GH_REPO"
          --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
          --windows build/release/windows --linux build/release/linux
