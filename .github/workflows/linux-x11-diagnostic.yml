name: Linux X11 diagnostic

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Linux release run containing the executable to diagnose
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Determine current artifact version
        id: version
        run: echo "version=$(python3 tools/check_release.py --source-root . --print-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: Sawer-${{ steps.version.outputs.version }}-Linux-x86_64
          path: build/linux-dist
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Install display dependencies and debugger
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            mesa-vulkan-drivers libvulkan1 libdecor-0-0 dbus-x11 xvfb \
            x11-utils openbox weston gdb libstdc++6 libgcc-s1
          chmod +x build/linux-dist/Sawer
      - name: Trace the X11 startup timeout
        run: |
          dbus-run-session -- python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import test_linux_display as display
          original_capture = display.capture_wait_channels
          def backtrace(pid, destination):
              original_capture(pid, destination)
              with destination.with_suffix(".gdb.txt").open("w") as log:
                  try:
                      subprocess.run(["sudo", "-n", "gdb", "--batch", "--nx", "-ex",
                                      "set pagination off", "-ex", "thread apply all bt", "-p", str(pid)],
                                     stdout=log, stderr=subprocess.STDOUT, timeout=20)
                  except subprocess.TimeoutExpired:
                      print("GDB timeout", file=log)
              for query in (["xwininfo", "-root", "-tree"], ["xprop", "-root"]):
                  with destination.with_suffix("." + query[0] + ".txt").open("w") as log:
                      subprocess.run(query, stdout=log, stderr=subprocess.STDOUT,
                                     env=display_environment, timeout=10)
          display.capture_wait_channels = backtrace
          original_run = display.run_logged_command
          def run(command, environment, log_path, timeout):
              global display_environment
              display_environment = environment
              return original_run(command, environment, log_path, timeout)
          display.run_logged_command = run
          for attempt in range(3):
              print(f"X11 startup attempt {attempt + 1}", flush=True)
              result = display.run_session("x11", [str(Path("build/linux-dist/Sawer").resolve()),
                                           "--render-test"], Path(f"build/diagnostic/{attempt}"))
              if result:
                  raise SystemExit(result)
          PY
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Linux-X11-diagnostic-logs
          path: build/diagnostic/
          if-no-files-found: error
